[package]
name = "focusly-desktop"
version = "0.1.0"
description = "Focusly desktop client — focus timer, tray, and (later) app tracking/blocking"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
