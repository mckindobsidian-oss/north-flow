<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Focusly</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      width: 300px;
      margin: 0;
      padding: 14px;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI Variable", "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      color: #1c1c1e;
      background: #f2f2f7;
    }
    @media (prefers-color-scheme: dark) {
      body { color: #f2f2f7; background: #000; }
      .card { background: #1c1c1e; border-color: #38383a; }
      input { background: #1c1c1e; border-color: #38383a; color: #f2f2f7; }
      .chip { background: #1c1c1e; border-color: #38383a; color: #f2f2f7; }
      .muted { color: #98989e; }
    }
    h1 { font-size: 15px; margin: 0 0 10px; display: flex; align-items: center; gap: 6px; }
    .card { background: #fff; border: 1px solid #e2e3e9; border-radius: 12px; padding: 10px; margin-bottom: 10px; }
    .muted { color: #6d6d72; font-size: 11px; }
    .row { display: flex; gap: 6px; margin: 8px 0; }
    .chip {
      flex: 1; border-radius: 8px; border: 1px solid #e2e3e9; background: #fff;
      padding: 6px 0; font-size: 12px; font-weight: 600; cursor: pointer; color: #1c1c1e;
    }
    .chip.primary { background: #007aff; border-color: #007aff; color: #fff; }
    .chip.stop { background: #ff3b30; border-color: #ff3b30; color: #fff; }
    button:active { transform: scale(.96); }
    input { width: 100%; border-radius: 8px; border: 1px solid #e2e3e9; padding: 6px 8px; font-size: 12px; outline: none; }
    input:focus { border-color: #007aff; }
    ul { list-style: none; margin: 6px 0 0; padding: 0; }
    li { display: flex; justify-content: space-between; align-items: center; padding: 4px 0; }
    .x { border: 0; background: none; color: #999; cursor: pointer; font-size: 14px; padding: 0 2px; }
  </style>
</head>
<body>
  <h1>⚡ Focusly</h1>

  <div class="card">
    <div class="muted" id="focusLabel">No active focus session</div>
    <div class="row" id="focusRow">
      <button class="chip" data-min="25">25m</button>
      <button class="chip" data-min="50">50m</button>
      <button class="chip" data-min="90">90m</button>
    </div>
    <button class="chip stop" id="stopBtn" hidden>End session</button>
  </div>

  <div class="card">
    <div style="font-weight: 600; margin-bottom: 6px">Blocked sites</div>
    <div class="row">
      <input id="siteInput" placeholder="youtube.com" />
      <button class="chip primary" id="addBtn" style="flex: 0 0 auto; padding: 6px 12px">Add</button>
    </div>
    <ul id="siteList"></ul>
  </div>

  <div class="card">
    <div style="font-weight: 600; margin-bottom: 6px">Today's browsing</div>
    <ul id="usageList"><li class="muted">No data yet</li></ul>
  </div>

  <script src="popup.js"></script>
</body>
</html>
