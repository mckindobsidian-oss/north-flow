# Netlify alternative to vercel.json — same shape, same output directory.
# Netlify resolves `base` before `command`, so the paths inside the web client
# (which is a normal Vite project) stay exactly as they are for local dev.
[build]
  base    = "react-app"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Vite fingerprints every asset under /assets, so those are safe to cache
# forever. index.html must NOT be, or a deploy would never be picked up.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
